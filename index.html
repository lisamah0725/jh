<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeR²🦁</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&family=DM+Sans:wght@400;500&display=swap');  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #023020;
    --surface: #fff;
    --text: #1c1a16;
    --muted: #7a756c;
    --border: rgba(0,0,0,0.08);
    --purple: #9D8EE0;
    --green: #56C28B;
    --red: #E86A58;
    --amber: #F4B942;
    --purple-light: rgba(157,142,224,0.12);
  }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .card {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 40px 44px 36px;
    max-width: 780px;
    width: 100%;
    box-shadow: 0 4px 40px rgba(0,0,0,0.06);
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }

  .header h1 {
    font-family: 'Roboto Slab', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.3px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 360px;
  }

  .tooltip {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 200px;
    line-height: 1.5;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .t-emoji { font-size: 20px; display: block; margin-bottom: 5px; }
  .tooltip .t-date { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 500; letter-spacing: 0.4px; text-transform: uppercase; }
  .tooltip .t-label { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .tooltip .t-sanity { font-size: 11px; color: var(--muted); margin-top: 5px; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    flex-shrink: 0;
  }

  .footer-note {
    text-align: center;
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>R²: Fundraising Journey</h1>
    <p>🦁's sanity % over time (hover the dots)</p>
  </div>

  <div class="chart-wrap">
    <canvas id="c"></canvas>
    <div class="tooltip" id="tip">
      <span class="t-emoji" id="tip-emoji"></span>
      <div class="t-date" id="tip-date"></div>
      <div class="t-label" id="tip-label"></div>
      <div class="t-sanity" id="tip-sanity"></div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#035236"></div>Win</div>
    <div class="legend-item"><div class="legend-dot" style="background:#F4B942"></div>Mauling</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E86A58"></div>Drama</div>
  </div>

  <div class="footer-note">Closes soon. Proud of you 😘 </div>
</div>

<script>
const points = [
  { label: "May '25",  sanity: 60, note: "Finally getting investor traction",               emoji: "📈", type: "mauling" },
  { label: "Jul '25",  sanity: 80, note: "Talking deal terms with a lead - TS incoming?",   emoji: "🤑", type: "mauling" },
  { label: "Sep '25",  sanity: 30, note: "Big throw-down argument with fellow partners",     emoji: "🌩️", type: "drama" },
  { label: "Sep '25",  sanity: 10, note: "Founder almost backs out!",     emoji: "😵", type: "drama" },
  { label: "Oct '25",  sanity: 75, note: "Public launch. Let's go!", emoji: "🚀", type: "mauling" },
  { label: "Nov '25",  sanity: 77, note: "Madrona's talking and Sequoia reached out!",      emoji: "🔥", type: "mauling" },
  { label: "Nov '25 ", sanity: 30, note: "Botha steps down... and another big fight internally", emoji: "🤺", type: "drama" },
  { label: "Dec '25",  sanity: 47, note: "Working the phones hard - Bite them if necessary", emoji: "📞", type: "mauling" },
  { label: "Jan '26",  sanity: 63, note: "Gaining traction again ... The grind is paying off",         emoji: "✨", type: "mauling" },
  { label: "Feb '26",  sanity: 77, note: "Plane ready for landing, and $12M DARPA grant!", emoji: "🎯", type: "win" },
  { label: "Mar '26",  sanity: 99, note: ":: champagne pops ::",                        emoji: "🍾", type: "win" },
];

const colorMap = { win: "#035236", mauling: "#F4B942", drama: "#E86A58" };

const ctx = document.getElementById('c').getContext('2d');

function buildGradient() {
  const g = ctx.createLinearGradient(0, 0, 0, 320);
  g.addColorStop(0, 'rgba(128,128,128,0.18');
  g.addColorStop(1, 'rgba(128,128,128,0)');
  return g;
}

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: points.map(p => p.label),
    datasets: [{
      data: points.map(p => p.sanity),
      borderColor: '#A9A9A9',
      borderWidth: 2.5,
      tension: 0.42,
      fill: true,
      backgroundColor: buildGradient(),
      pointBackgroundColor: points.map(p => colorMap[p.type]),
      pointBorderColor: '#ffffff',
      pointBorderWidth: 2.5,
      pointRadius: 9,
      pointHoverRadius: 12,
      pointHitRadius: 18,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 1100, easing: 'easeInOutQuart', onComplete: drawAnnotations },
    plugins: { legend: { display: false }, tooltip: { enabled: false } },
    scales: {
      x: {
        grid: { color: 'rgba(0,0,0,0.05)', lineWidth: 0.5 },
        ticks: { color: '#7a756c', font: { size: 11 }, maxRotation: 35 },
        border: { display: false },
      },
      y: {
        min: 0, max: 110,
        grid: { color: 'rgba(0,0,0,0.05)', lineWidth: 0.5 },
        ticks: {
          color: '#7a756c', font: { size: 11 }, stepSize: 20,
          callback: v => v <= 100 ? v + '%' : ''
        },
        border: { display: false },
        title: { display: true, text: 'Sanity %', color: '#7a756c', font: { size: 12 } }
      }
    },
    hover: { mode: 'nearest', intersect: true },
  }
});

function drawAnnotations() {
  const meta = chart.getDatasetMeta(0);
  const last = meta.data[meta.data.length - 1];
  ctx.save(); ctx.font = '20px serif'; ctx.textAlign = 'center';
  ctx.fillText('🎊', last.x, last.y - 26);
  ctx.fillText(meta.data[4].x, meta.data[4].y - 26);
  ctx.fillText(meta.data[2].x, meta.data[2].y + 30);
  ctx.restore();
}

const tip = document.getElementById('tip');
const tipEmoji = document.getElementById('tip-emoji');
const tipDate = document.getElementById('tip-date');
const tipLabel = document.getElementById('tip-label');
const tipSanity = document.getElementById('tip-sanity');
const canvas = document.getElementById('c');

canvas.addEventListener('mousemove', function(e) {
  const rect = canvas.getBoundingClientRect();
  const els = chart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, false);
  if (els.length) {
    const idx = els[0].index;
    const pt = points[idx];
    const px = chart.getDatasetMeta(0).data[idx].x;
    const py = chart.getDatasetMeta(0).data[idx].y;
    tipEmoji.textContent = pt.emoji;
    tipDate.textContent = pt.label.trim();
    tipLabel.textContent = pt.note;
    tipSanity.textContent = 'Sanity: ' + pt.sanity + '%';
    let tx = px + 16, ty = py - 20;
    if (tx + 200 > rect.width) tx = px - 216;
    if (ty < 0) ty = 10;
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
    tip.classList.add('visible');
  } else {
    tip.classList.remove('visible');
  }
});
canvas.addEventListener('mouseleave', () => tip.classList.remove('visible'));
</script>
</body>
</html>
